face_detection:
  min_detection_confidence: 0.5
eye:
  ear_threshold: 0.25 # Ngưỡng EAR phân biệt open/closed
  closure_time_threshold: 1.5 # Giây (nhắm mắt liên tục tính là drowsy)
mouth:
  mar_threshold: 0.6 # Ngưỡng MAR phân biệt ngáp
  yawn_duration_threshold: 2.0 # Giây ngáp liên tục
  yawn_frequency_window: 60.0   # Cửa sổ trượt tính tần suất ngáp (giây)
  yawn_frequency_threshold: 3.0 # Số lần ngáp/phút (drowsy)
alert:
  cooldown: 3.0
temporal:
  missing_face_tolerance_frames: 5  # Số frame cho phép mất mặt tạm thời (Hold state)
  missing_face_timeout_sec: 1.5      # Thời gian timeout để reset trạng thái (giây)